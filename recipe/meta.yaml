{% set name = "proxsuite" %}
{% set version = "0.8.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/Simple-Robotics/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 57201b1b2d175e120f9fd27e0d024c1b087b65004da84ee65f0317256f1ac235

build:
  number: 0

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
    - cmake
    - ninja
    - doxygen
    - libgomp       # [linux]
    - llvm-openmp   # [osx or win]
    - jrl-cmakemodules
  host:
    - eigen
    - python
    - simde
    - cereal
  run:
    - eigen
    - python
    - scipy
    - numpy
    - simde
    - cereal

test:
  imports:
    - proxsuite
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/simple-robotics/proxsuite
  summary: Quadratic Programming Solver for Robotics and beyond.
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/simple-robotics/proxsuite

extra:
  recipe-maintainers:
    - jorisv
    - fabinsch
    - jcarpent
    - Bambade
